# CI Pipeline for ml-sentiment-app
# Gitea Actions uses the same syntax as GitHub Actions.
# Documentation: https://docs.gitea.com/usage/actions/overview
#
# TODO: Define the trigger (on push/PR to main)
# TODO: Define jobs for: lint, type-check, test, build-and-push, sbom
#
# Hints:
#   - Use actions/checkout@v4 and actions/setup-python@v5
#   - The CI runner has Docker available (via socket mount)
#   - For the registry address, see the infrastructure table in the assignment README

name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: localhost:5001
  IMAGE_NAME: ml-sentiment-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: setup python, install dependencies, run ruff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m textblob.download_corpora
      - name: Health check
        run: |
          uvicorn src.inference:app --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ 2>&1 | tee ruff-report.txt
          exit ${PIPESTATUS[0]}

      - name: Run mypy
        run: |
          mypy src/ 2>&1 | tee mypy-report.txt
          exit ${PIPESTATUS[0]}


      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v3
        with: 
          name: ci-reports-${{ gitea.run_id }}
          path: |
             ruff-report.txt
             mypy-report.txt
      
      - name: Run tests with pytest
        run: |
          pytest --cov=src --cov-report=term-missing 2>&1 | tee pytest-report.txt          

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ci-reports-${{ gitea.run_id }}
          path: |
            ruff-report.txt
            mypy-report.txt
            pytest-report.txt         
      

  # TODO: add type-check, test, build-and-push, sbom jobs
